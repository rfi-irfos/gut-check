[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gut-check"
version = "0.1.0"
description = "A System-1/System-2 dual-loop verification gate for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "RFI-IRFOS" }
]
keywords = ["agents", "verification", "calibration", "system-one", "escalation", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "laya>=0.3.5",
]

[project.optional-dependencies]
training = ["modal", "huggingface_hub>=0.20.0"]
sidecar = ["fastapi", "uvicorn"]
dev = ["pytest"]

[tool.setuptools]
packages = ["gate"]
package-dir = { "gate" = "core/gate" }

[project.urls]
Homepage = "https://github.com/rfi-irfos/gut-check"
Repository = "https://github.com/rfi-irfos/gut-check"
